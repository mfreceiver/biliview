[versions]
agp = "9.3.1"
# Kotlin 版本由 AGP 内置 Kotlin 决定（AGP 9.3.1 的 POM 依赖 kotlin-gradle-plugin:2.2.10），
# 这里只用于 compose/serialization 编译器子插件与纯 JVM 模块的 kotlin.jvm，必须与内置版本一致。
kotlin = "2.2.10"
# KSP ≥2.3.10 才修了「AGP 内置 Kotlin 下的 R 类解析」(google/ksp#2857)。
ksp = "2.3.12"
protobuf = "0.10.0"
versions = "0.52.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# https://github.com/google/ksp
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# https://github.com/google/protobuf-gradle-plugin
google-protobuf = { id = "com.google.protobuf", version.ref = "protobuf" }

# https://github.com/ben-manes/gradle-versions-plugin
versions = { id = "com.github.ben-manes.versions", version.ref = "versions" }